<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --black:#141210;
    --ivory:#f2e8c9;
    --red:#d4271f;
    --yellow:#f5c518;
    --cobalt:#1f5fd4;
    --green:#0f7a4f;
    --marker:'Permanent Marker',cursive;
    --name:'Fraunces',Georgia,serif;
    --scrawl:'Rock Salt',cursive;
    --body:'Archivo',system-ui,sans-serif;
  }
  html{scroll-behavior:smooth;background:#f2e8c9}
  body{
    background:var(--ivory);color:var(--black);
    font-family:var(--body);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;position:relative;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 22px;position:relative;z-index:2}


  /* ---------- hero ---------- */
  .hero{position:relative;padding:64px 0 0}
  h1{font-family:var(--marker);font-weight:400;line-height:1;letter-spacing:.01em;
    white-space:nowrap;display:block;font-size:80px}
  h1 .n1,h1 .n2{color:#fff;-webkit-text-stroke:2px var(--black);paint-order:stroke fill}
  h1{filter:drop-shadow(4px 4px 0 var(--black))}
  .role{margin:14px 0 0;font-family:var(--marker);font-size:20px;line-height:1;
    letter-spacing:.01em;display:block;color:var(--black)}

  /* ---------- trajectory ---------- */
  .path{margin:0;position:relative;width:100%}
  .path-label{font-family:var(--scrawl);font-size:11px;opacity:.6;margin-bottom:14px;
    text-transform:uppercase;letter-spacing:.06em}
  .nodes{display:flex;align-items:flex-start;flex-wrap:nowrap;width:100%;gap:0}
  /* diamond trajectory */
  .nodes.diamond{display:grid;position:relative;width:100%;
    grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;
    row-gap:34px;align-items:center;justify-items:center}
  .diamond .node{position:relative;z-index:2;flex:none!important;align-self:center}
  .col-l{grid-column:1;grid-row:1 / span 2}
  .col-r{grid-column:3;grid-row:1 / span 2}
  .col-m.top{grid-column:2;grid-row:1}
  .col-m.bot{grid-column:2;grid-row:2}
  /* four connector lines drawn with a single SVG that scales to the grid box */
  .diamond .flow{position:absolute;inset:0;width:100%;height:100%;z-index:1;
    pointer-events:none;overflow:visible}
  .node{display:flex;flex-direction:column;align-items:center;gap:10px;
    text-align:center;flex:1.5 1 0;min-width:0;align-self:stretch}
  .node .status-tag{margin-top:auto}
  .bulb .db{font-size:40px;line-height:0}
  .bulb{width:74px;height:74px;border:3px solid var(--black);border-radius:50%;
    display:grid;place-items:center;font-family:var(--marker);font-size:24px;
    background:var(--ivory);position:relative;line-height:0}
  .node .bulb{background:#fff;color:var(--black);box-shadow:4px 4px 0 var(--black)}
  /* future node: same style as the others, just greyed out */
  .node.off .bulb{opacity:.4}
  .node.off .cap{opacity:.4}
  .node .cap{font-family:var(--marker);font-size:15px;line-height:1.15;max-width:none}
  .arrow{flex:1 1 0;height:74px;display:flex;align-items:center;min-width:20px;padding:0 6px}
  .arrow::before{content:"";flex:1;height:3px;background:var(--black)}
  .arrow::after{content:"";width:0;height:0;border-left:15px solid var(--black);
    border-top:9px solid transparent;border-bottom:9px solid transparent}
  .arrow.dim::before{background:#8a8272}
  .arrow.dim::after{border-left-color:#8a8272}
  .status-tag{display:inline-block;margin-top:auto;font-family:var(--body);
    font-weight:700;font-size:7.5px;text-transform:uppercase;letter-spacing:.07em;
    padding:2px 7px;border:1.5px solid var(--black);border-radius:999px;
    color:var(--black);box-shadow:1.5px 1.5px 0 var(--black)}
  .on .status-tag{background:var(--green);color:#fff}
  .on.now .status-tag{background:var(--yellow);color:var(--black)}
  .off .status-tag{background:var(--red);color:#fff}

  .bio{margin-top:40px;max-width:none;font-size:clamp(18px,2.6vw,24px);
    font-weight:600;line-height:1.6}

  /* ---------- link blocks ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);
    gap:20px;padding:0}
  .block{position:relative;display:block;min-height:150px;padding:26px 22px 46px;
    border:3px solid var(--black);color:var(--black);text-decoration:none;
    box-shadow:7px 7px 0 var(--black);
    transition:transform .12s ease,box-shadow .12s ease}
  .block:nth-child(1){background:var(--cobalt);color:var(--ivory);transform:rotate(-1.2deg)}
  .block:nth-child(2){background:var(--green);color:var(--ivory);transform:rotate(1deg)}
  .block:nth-child(3){background:var(--red);color:var(--ivory);transform:rotate(.6deg)}
  .block:nth-child(4){background:var(--yellow);transform:rotate(-.8deg)}
  .block:hover{transform:translate(-3px,-3px) rotate(0deg);box-shadow:11px 11px 0 var(--black)}
  .block:focus-visible{outline:4px dashed var(--black);outline-offset:5px}
  .block .num{position:absolute;right:16px;bottom:14px;font-family:var(--marker);
    font-size:15px;opacity:.85}
  .block .name{font-family:var(--marker);font-size:clamp(26px,4.5vw,34px);
    line-height:1;margin-top:6px}
  .block .name.long{font-size:clamp(15px,2.4vw,22px);word-break:break-all;margin-top:10px}
  .block .go{font-family:var(--scrawl);font-size:12px;margin-top:10px;display:block}
  .block .ext{position:absolute;bottom:14px;left:16px;font-family:'Archivo',system-ui,'Segoe UI Symbol','Noto Sans Symbols 2',sans-serif;font-size:16px;font-variant-emoji:text;-webkit-font-feature-settings:normal}

  footer{padding:30px 0 70px}
  .rule{height:4px;background:var(--black);margin-bottom:20px;
    transform:rotate(-.4deg);transform-origin:center}
  .sp{height:4px;background:var(--black);margin:30px 0;transform-origin:center}
  .sp.a{transform:rotate(.35deg);margin-top:16px}
  .sp.b{transform:rotate(-.3deg)}
  .foot{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;
    font-family:var(--scrawl);font-size:12px}
  .foot .mk{font-family:var(--marker);color:var(--black)}
  .foot .za{font-family:var(--marker);font-style:normal;font-weight:400;
    color:var(--cobalt);letter-spacing:.02em}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--black);color:var(--yellow);font-family:var(--marker);
    font-size:14px;padding:10px 18px;border:2px solid var(--yellow);
    opacity:0;pointer-events:none;transition:all .22s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    .block,.role{transform:none!important}}
  @media(max-width:560px){
    .bulb{width:56px;height:56px;font-size:20px}
    .bulb .db{font-size:30px}
    .node .cap{font-size:11px;max-width:none}
    .arrow{height:56px;min-width:16px;padding:0 4px}
    .arrow::after{border-left-width:11px;border-top-width:7px;border-bottom-width:7px}
    .bulb svg{width:34px;height:auto}
  }
</style>

<script>
  const link=document.getElementById('emailLink'),toast=document.getElementById('toast');
  link.addEventListener('click',async(e)=>{
    e.preventDefault();
    const email=link.dataset.email;
    try{await navigator.clipboard.writeText(email);
      toast.textContent='COPIED TO CLIPBOARD';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),1700);
    }catch(err){window.location.href='mailto:'+email;}
  });


  // scale the name to fill the content column on one line
  (function(){
    const h1=document.querySelector('h1'); if(!h1) return;
    const fit=()=>{
      const parent=h1.parentElement;
      const avail=parent.clientWidth;
      h1.style.fontSize='80px';
      const w=h1.scrollWidth;
      if(w>0){ h1.style.fontSize=(80*avail/w).toFixed(2)+'px'; }
    };
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
    window.addEventListener('load',fit);
    window.addEventListener('resize',fit);
    fit();
  })();



  // draw diamond arrows from real bulb centers to bulb edges
  (function(){
    const grid=document.querySelector('.nodes.diamond'); if(!grid) return;
    const flow=grid.querySelector('.flow');
    const nodes={
      l:grid.querySelector('.col-l .bulb'),
      t:grid.querySelector('.col-m.top .bulb'),
      b:grid.querySelector('.col-m.bot .bulb'),
      r:grid.querySelector('.col-r .bulb')
    };
    const lines={ln1:['l','t'],ln2:['l','b'],ln3:['t','r'],ln4:['b','r']};
    function center(el,gb){const r=el.getBoundingClientRect();
      return {x:r.left-gb.left+r.width/2, y:r.top-gb.top+r.height/2, rad:r.width/2};}
    function draw(){
      const gb=grid.getBoundingClientRect();
      flow.setAttribute('viewBox',`0 0 ${gb.width} ${gb.height}`);
      flow.setAttribute('width',gb.width); flow.setAttribute('height',gb.height);
      for(const [id,[a,c]] of Object.entries(lines)){
        const A=center(nodes[a],gb), C=center(nodes[c],gb);
        const dx=C.x-A.x, dy=C.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
        const startGap=A.rad, endGap=C.rad;
        const el=document.getElementById(id);
        el.setAttribute('x1',(A.x+ux*startGap).toFixed(1));
        el.setAttribute('y1',(A.y+uy*startGap).toFixed(1));
        el.setAttribute('x2',(C.x-ux*endGap).toFixed(1));
        el.setAttribute('y2',(C.y-uy*endGap).toFixed(1));
      }
    }
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(draw);}
    window.addEventListener('load',draw);
    window.addEventListener('resize',draw);
    draw();
  })();

</script>
</body>
